[package]
name = "lemon-mix"
description = "Audio mixer with virtual audio devices exported as USB Audio Class 2.0 devices over USB/IP"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "LemonMix"
path = "src/main.rs"

[dependencies]
cables.workspace = true
engine.workspace = true
devices.workspace = true
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }

[target."cfg(windows)".dependencies]
windows-sys.workspace = true
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "default_fonts"] }
tray-icon = { version = "=0.19.3", default-features = false }
raw-window-handle = "0.6"

[build-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
