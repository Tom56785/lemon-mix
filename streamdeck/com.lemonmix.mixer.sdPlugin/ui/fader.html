<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<script src="sdpi-components.js"></script>
		<style>
			.note { color: #9a9a9a; font-size: 9pt; margin: 8px 16px 0; line-height: 1.4; }
		</style>
	</head>
	<body>
		<sdpi-item label="Strip or bus">
			<sdpi-select setting="target" datasource="getTargets" hot-reload placeholder="Choose one" loading="Waiting for Lemon Mix"></sdpi-select>
		</sdpi-item>
		<sdpi-item label="Each step">
			<sdpi-select setting="step" default="1">
				<option value="0.5">0.5 dB</option>
				<option value="1">1 dB</option>
				<option value="2">2 dB</option>
				<option value="3">3 dB</option>
			</sdpi-select>
		</sdpi-item>
		<p class="note">The lists come from Lemon Mix while it runs. A choice follows its strip or bus when others are added, removed or renamed.</p>
	</body>
</html>
