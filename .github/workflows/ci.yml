name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --component clippy,rustfmt
          rustup default stable-x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Self-test
        run: |
          # Piped, or PowerShell neither waits for this Windows program nor
          # sets $LASTEXITCODE.
          target/debug/LemonMix.exe --self-test | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "The self-test failed." }

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
